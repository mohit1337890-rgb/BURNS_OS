# ==============================================================================
# Burns OS - docker-compose.yml
#
# WRITTEN, NOT YET RUN. This dev machine does not have Docker or WSL2
# installed (verified 2026-09-28 - see docs/KNOWN_LIMITS.md). Every image
# tag below is pinned deliberately (never "latest") so the first real
# `docker compose up` is reproducible rather than pulling whatever happens
# to be current that day. Versions were chosen for compatibility as of this
# writing - re-verify against each project's own release notes before the
# first real run, per BUILD PROMPT section 9 ("read the official docs...
# where docs contradict this prompt, follow the docs").
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      # This becomes the Postgres SUPERUSER via the official image's own
      # bootstrap (unavoidable - that's just how POSTGRES_USER works) -
      # "burns_admin" now names that honestly. Migrations run as this role;
      # the app itself (gateway/approvals_bot/scheduler) never does - see
      # BURNS_APP_DB_USER below and KNOWN_LIMITS gap #10.
      POSTGRES_USER: ${POSTGRES_USER:-burns_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burns_admin} -d ${POSTGRES_DB:-burns_os}"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD must be set in .env}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set in .env}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set in .env}
      NEXTAUTH_URL: http://localhost:3001
      # Docker auto-sets HOSTNAME to the container's own short id; the
      # langfuse/next.js standalone server reads it as its bind address, so
      # without this override it listens on <container-ip>:3000 only -
      # unreachable via localhost/127.0.0.1 (both the healthcheck below and,
      # via loopback, this container's own other processes).
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      # "localhost" resolves IPv6 (::1) first in this image and nothing
      # listens there (HOSTNAME=0.0.0.0 above binds IPv4 only) - wget
      # doesn't fall back to IPv4 the way e.g. Python's urllib does, so it
      # gets "Connection refused" forever. Explicit 127.0.0.1 sidesteps it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      # CRITICAL - a SEPARATE database (litellm_db) AND a separate,
      # dedicated role (litellm_app), never burns_os / burns_admin. Found
      # live (2026-09-28, docs/incidents/2026-09-litellm-table-drop.md):
      # litellm's Prisma schema-sync ("db push") treats the entire
      # connected database's public schema as its own and silently DROPS
      # any table it doesn't recognize - it dropped ledger (26 rows),
      # approvals (7 rows) and alembic_version outright when it was
      # pointed at burns_os (as burns_admin, a superuser with unrestricted
      # access to every database on this server). Two independent layers
      # now: (1) litellm_db is a separate DATABASE - Postgres databases are
      # fully isolated from each other, so this specific failure mode is
      # structurally impossible now, not just avoided by convention; (2)
      # litellm_app OWNS litellm_db but has ZERO grants on burns_os (no
      # CONNECT even) - a bug or a compromised litellm couldn't reach
      # burns_os's tables even if it were somehow pointed at the wrong
      # database again. Both created once, manually, by an admin - not by
      # this compose file, same reasoning as burns_app not being
      # auto-created by the postgres image's own bootstrap.
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm_app}:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set in .env}@postgres:5432/litellm_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
    volumes:
      - ./configs/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    # Dual-homed (Milestone 2) - default for postgres/everything else it
    # already needed, PLUS hermes_internal so the Hermes containers can
    # reach it (and reach ONLY it and gateway-mcp - see the top-level
    # networks: block).
    networks: [default, hermes_internal]
    healthcheck:
      # No wget/curl in this image (verified 2026-09-28) - python3 (already
      # present, it's how litellm itself runs) via urllib instead.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      # burns_app (restricted role, migration 0003) - deliberately NOT
      # POSTGRES_USER/PASSWORD (the admin/superuser). Migrations are run
      # via `docker compose exec -e POSTGRES_USER=... -e POSTGRES_PASSWORD=...`
      # (Makefile's `up` target) so the admin password is never baked into
      # this long-running container's own environment. KNOWN_LIMITS gap #10.
      BURNS_APP_DB_USER: ${BURNS_APP_DB_USER:-burns_app}
      BURNS_APP_DB_PASSWORD: ${BURNS_APP_DB_PASSWORD:?BURNS_APP_DB_PASSWORD must be set in .env}
      LEDGER_ANCHOR_PATH: /data/ledger_anchor_v2_20260929.jsonl
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?TELEGRAM_OWNER_CHAT_ID must be set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN must be set in .env}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:?MONTHLY_AI_BUDGET_USD must be set in .env}
      DEFAULT_MISSION_BUDGET_USD: ${DEFAULT_MISSION_BUDGET_USD:?DEFAULT_MISSION_BUDGET_USD must be set in .env}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:?MAX_RISK_PER_TRADE_PCT must be set in .env}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:?MAX_DAILY_LOSS_PCT must be set in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ledger_anchor_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # No wget/curl in python:3.12-slim (verified 2026-09-28) - matches
      # deploy/Dockerfile.gateway's own HEALTHCHECK, which this overrides.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  approvals_bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.approvals_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      BURNS_APP_DB_USER: ${BURNS_APP_DB_USER:-burns_app}
      BURNS_APP_DB_PASSWORD: ${BURNS_APP_DB_PASSWORD:?BURNS_APP_DB_PASSWORD must be set in .env}
      LEDGER_ANCHOR_PATH: /data/ledger_anchor_v2_20260929.jsonl
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?TELEGRAM_OWNER_CHAT_ID must be set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:?MONTHLY_AI_BUDGET_USD must be set in .env}
      DEFAULT_MISSION_BUDGET_USD: ${DEFAULT_MISSION_BUDGET_USD:?DEFAULT_MISSION_BUDGET_USD must be set in .env}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:?MAX_RISK_PER_TRADE_PCT must be set in .env}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:?MAX_DAILY_LOSS_PCT must be set in .env}
    volumes:
      - ledger_anchor_data:/data

  # Real periodic process for core/scheduler.py (Tier-3 post-cooling
  # execution + stale-PENDING expiry) and core/ledger_anchor.py (hourly tail-
  # truncation anchor) - both modules are deliberately pure logic with no
  # loop of their own (see their docstrings); this is that loop. Reuses the
  # gateway image (no separate build) since it already has every module
  # this needs.
  scheduler:
    image: burns_os_system-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      BURNS_APP_DB_USER: ${BURNS_APP_DB_USER:-burns_app}
      BURNS_APP_DB_PASSWORD: ${BURNS_APP_DB_PASSWORD:?BURNS_APP_DB_PASSWORD must be set in .env}
      LEDGER_ANCHOR_PATH: /data/ledger_anchor_v2_20260929.jsonl
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?TELEGRAM_OWNER_CHAT_ID must be set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:?MONTHLY_AI_BUDGET_USD must be set in .env}
      DEFAULT_MISSION_BUDGET_USD: ${DEFAULT_MISSION_BUDGET_USD:?DEFAULT_MISSION_BUDGET_USD must be set in .env}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:?MAX_RISK_PER_TRADE_PCT must be set in .env}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:?MAX_DAILY_LOSS_PCT must be set in .env}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      ANCHOR_INTERVAL_SECONDS: ${ANCHOR_INTERVAL_SECONDS:-3600}
      RECONCILIATION_STALE_MINUTES: ${RECONCILIATION_STALE_MINUTES:-15}
    volumes:
      - ledger_anchor_data:/data
    command: ["python", "-m", "scripts.scheduler_loop"]
    # Otherwise inherits the gateway image's own baked-in HEALTHCHECK
    # (probes localhost:8080/health) - this service runs no HTTP server, so
    # that would falsely report "unhealthy" forever.
    healthcheck:
      disable: true

  # Milestone 2: the Gateway's MCP tools (execute_action/get_approval_status/
  # verify_ledger) over streamable-http, for the Hermes containers - see
  # docs/MILESTONE_2_HERMES_DESIGN.md. Deliberately NOT in `ports:` - only
  # reachable from other containers on this compose network by hostname
  # (`gateway-mcp:8091`), never from the host or internet. Reuses the
  # gateway image (no separate build), same pattern as `scheduler`.
  gateway-mcp:
    image: burns_os_system-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      BURNS_APP_DB_USER: ${BURNS_APP_DB_USER:-burns_app}
      BURNS_APP_DB_PASSWORD: ${BURNS_APP_DB_PASSWORD:?BURNS_APP_DB_PASSWORD must be set in .env}
      LEDGER_ANCHOR_PATH: /data/ledger_anchor_v2_20260929.jsonl
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?TELEGRAM_OWNER_CHAT_ID must be set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:?MONTHLY_AI_BUDGET_USD must be set in .env}
      DEFAULT_MISSION_BUDGET_USD: ${DEFAULT_MISSION_BUDGET_USD:?DEFAULT_MISSION_BUDGET_USD must be set in .env}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:?MAX_RISK_PER_TRADE_PCT must be set in .env}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:?MAX_DAILY_LOSS_PCT must be set in .env}
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_PORT: 8091
      HERMES_MCP_TOKEN_CHIEF: ${HERMES_MCP_TOKEN_CHIEF:?HERMES_MCP_TOKEN_CHIEF must be set in .env}
      HERMES_MCP_TOKEN_RESEARCHER: ${HERMES_MCP_TOKEN_RESEARCHER:?HERMES_MCP_TOKEN_RESEARCHER must be set in .env}
    volumes:
      - ledger_anchor_data:/data
    command: ["python", "-m", "gateway.mcp_server"]
    # Dual-homed (Milestone 2) - default (needs Postgres for the Ledger),
    # PLUS hermes_internal so the Hermes containers can reach this
    # specifically (and nothing else on hermes_internal but litellm).
    networks: [default, hermes_internal]
    healthcheck:
      test: ["CMD", "python", "-m", "gateway.healthcheck_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The primary approval/control channel now (Telegram postponed - see
  # core/approval_channels.py, docs/KNOWN_LIMITS.md). Bound to
  # 127.0.0.1 ONLY - never expose this port publicly. For phone access,
  # use Tailscale (docs/DASHBOARD.md) - never a public port/reverse proxy.
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-burns_os}
      BURNS_APP_DB_USER: ${BURNS_APP_DB_USER:-burns_app}
      BURNS_APP_DB_PASSWORD: ${BURNS_APP_DB_PASSWORD:?BURNS_APP_DB_PASSWORD must be set in .env}
      LEDGER_ANCHOR_PATH: /data/ledger_anchor_v2_20260929.jsonl
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?TELEGRAM_OWNER_CHAT_ID must be set in .env}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:?MONTHLY_AI_BUDGET_USD must be set in .env}
      DEFAULT_MISSION_BUDGET_USD: ${DEFAULT_MISSION_BUDGET_USD:?DEFAULT_MISSION_BUDGET_USD must be set in .env}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:?MAX_RISK_PER_TRADE_PCT must be set in .env}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:?MAX_DAILY_LOSS_PCT must be set in .env}
      # true by default (Secure cookies) - live-tested 2026-09-29 to work
      # fine over plain http://127.0.0.1 too (loopback is a "potentially
      # trustworthy origin", exempt from the HTTPS requirement - see
      # docs/DASHBOARD.md). Only ever needs to be false if something other
      # than a loopback address sits in front of this without TLS.
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
      # Milestone 2: Command box -> hermes-chief (fire-and-forget). Unset
      # in .env means the Command box degrades to log-only, gracefully -
      # see dashboard/app.py's own comment on this.
      HERMES_CHIEF_API_SERVER_KEY: ${HERMES_CHIEF_API_SERVER_KEY:-}
    volumes:
      - ledger_anchor_data:/data
    # Dual-homed (Milestone 2) - default for postgres/gateway (already
    # needed), PLUS hermes_internal so this can reach hermes-chief's
    # api-server specifically (and nothing else on that network but
    # litellm/gateway-mcp, which this doesn't need and never calls).
    networks: [default, hermes_internal]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/login')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milestone 2 (docs/MILESTONE_2_HERMES_DESIGN.md): the two Hermes
  # containers. Config is pre-written (deploy/hermes/{researcher,chief}/
  # config.yaml, rendered by scripts/generate_hermes_config.py from the
  # committed .template - hermes setup's interactive wizard is bypassed
  # entirely for a reproducible, headless deployment) - NOT built by this
  # compose file (a real, large, third-party image: nousresearch/hermes-agent).
  hermes-researcher:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    depends_on:
      gateway-mcp:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - ./deploy/hermes/researcher:/opt/data
    command: ["hermes", "gateway", "run"]
    # ONLY this network - no `default`, no internet, no route to Postgres/
    # SMTP/anything else. No `ports:` either - not reachable from the host.
    networks: [hermes_internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8642/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  hermes-chief:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    depends_on:
      gateway-mcp:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - ./deploy/hermes/chief:/opt/data
    command: ["hermes", "gateway", "run"]
    networks: [hermes_internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8642/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  default: {}
  # Milestone 2 (docs/MILESTONE_2_HERMES_DESIGN.md section 2): the two
  # Hermes containers join ONLY this network - `internal: true` means no
  # default route, no internet access at all. litellm/gateway-mcp are
  # dual-homed (default + this) so Hermes can reach exactly those two
  # services and nothing else - not Postgres, not the internet, not SMTP.
  hermes_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  langfuse_db_data:
  ledger_anchor_data:
