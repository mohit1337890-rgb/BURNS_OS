[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is deliberately NOT hardcoded here - db/migrations/env.py
# reads DATABASE_URL from the environment at runtime instead (same
# core.app_config.load_core_config()-composed URL the Gateway itself uses)
# so this file never needs a real password committed to it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
