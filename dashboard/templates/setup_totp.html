<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burns OS - Enable 2FA</title>
<style>
  body { margin: 0; background: #0f1115; color: #e6e8eb; font-family: -apple-system, Segoe UI, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #171a21; border: 1px solid #2a2e38; border-radius: 10px; padding: 24px; width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 20px; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #2a2e38; background: #0b0d11; color: #e6e8eb; width: 100%; margin-bottom: 10px; box-sizing: border-box; text-align: center; }
  button { cursor: pointer; background: #4f8cff; border: none; color: white; font-weight: 600; }
  .error { color: #f25555; margin-bottom: 10px; }
  .muted { color: #8a8f9a; font-size: 13px; }
  img { background: white; padding: 8px; border-radius: 8px; margin-bottom: 12px; }
  code { display: block; word-break: break-all; background: #0b0d11; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Scan this with your authenticator app</h1>
  <img src="data:image/png;base64,{{ qr_b64 }}" width="220" height="220" alt="TOTP QR code">
  <p class="muted">Or enter this secret manually:</p>
  <code>{{ secret }}</code>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/setup/totp">
    <input type="hidden" name="secret" value="{{ secret }}">
    <input type="text" name="code" placeholder="6-digit code" inputmode="numeric" pattern="[0-9]*" required autofocus>
    <button type="submit">Confirm and enable 2FA</button>
  </form>
</div>
</body>
</html>
