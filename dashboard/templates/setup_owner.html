<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burns OS - First-time setup</title>
<style>
  body { margin: 0; background: #0f1115; color: #e6e8eb; font-family: -apple-system, Segoe UI, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #171a21; border: 1px solid #2a2e38; border-radius: 10px; padding: 24px; width: 100%; max-width: 380px; }
  h1 { font-size: 20px; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #2a2e38; background: #0b0d11; color: #e6e8eb; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
  button { cursor: pointer; background: #4f8cff; border: none; color: white; font-weight: 600; }
  .error { color: #f25555; margin-bottom: 10px; }
  .muted { color: #8a8f9a; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>Create the owner account</h1>
  <p class="muted">One-time setup. This is the only account this system will ever have.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/setup/owner">
    <input type="text" name="username" placeholder="Username" required autofocus>
    <input type="password" name="password" placeholder="Password (min 12 characters)" required minlength="12">
    <input type="password" name="confirm_password" placeholder="Confirm password" required minlength="12">
    <button type="submit">Create account</button>
  </form>
</div>
</body>
</html>
