# LiteLLM proxy config (BUILD PROMPT section 3: "Routes: premium
# (coding/planning), cheap (summaries/classification), local via Ollama
# (sensitive data)"). Model names/pricing drift over time - re-verify
# against https://docs.litellm.ai/docs/providers before relying on this.
#
# 2026-09-29: switched to OpenRouter + NVIDIA NIM (the two providers Mohit
# actually has keys for) instead of a direct Anthropic key, which was
# never configured. See .env.example for OPENROUTER_API_KEY/
# NVIDIA_NIM_API_KEY.
#
# Both routes deliberately point at genuinely $0 models (Mohit's explicit
# request, to avoid surprise billing during Milestone 2 testing) -
# premium's model ID confirmed live against OpenRouter's own
# /api/v1/models endpoint (pricing.prompt == "0"), not assumed from a
# blog post - free-model rosters shift constantly, re-verify the same
# way before trusting an older note. cheap's NVIDIA NIM model is on
# NVIDIA's own free developer tier (build.nvidia.com), not billed
# per-token for moderate individual use.

model_list:
  - model_name: premium
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cheap
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-8b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: local
    litellm_params:
      model: ollama/llama3.1
      api_base: http://host.docker.internal:11434
      # Local/Ollama is for SENSITIVE DATA specifically (BUILD PROMPT
      # section 3) - never routes to a cloud provider, by design, not by
      # accident of config.

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Per-key/per-model budget enforcement (BUILD PROMPT section 4.8's Budget
  # Guard is a SEPARATE, Ledger-based check in core/budget_guard.py - this
  # is LiteLLM's own, independent limit as a second line of defense).
  max_budget: 100
  budget_duration: 30d
